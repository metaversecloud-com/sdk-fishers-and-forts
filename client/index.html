<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Trivia's fonts: Bricolage Grotesque (display), Space Mono (labels), Outfit (body). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- The Topia SDK stylesheet is imported from src/index.css inside
         @import url(...) layer(sdk) so app-specific CSS can override it
         without specificity hacks. Do NOT add a <link> for it here — that
         would land outside the cascade layers and win over everything. -->

    <title>Fishers &amp; Forts</title>
  </head>
  <body class="rtsdk">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
